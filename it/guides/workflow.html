<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMET — Guida operativa</title>
<style>
  :root {
    --bg: #0e1116; --bg2: #141923; --card: #171d29; --border: #262f40;
    --text: #e6ebf2; --muted: #8b96a8; --accent: #f59e0b; --accent2: #d97706;
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .top {
    display: flex; align-items: center; gap: 12px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); background: rgba(14,17,22,.7);
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px);
  }
  .top .logo { font-size: 22px; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .top .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .top .lang { margin-left: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  .top .lang:hover { color: var(--text); border-color: var(--accent); }

  .layout { display: flex; gap: 20px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
  nav.side { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 70px; }
  nav.side button {
    text-align: left; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13.5px; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  nav.side button:hover { border-color: #3a4a63; color: var(--text); }
  nav.side button.on { border-color: var(--accent); color: var(--text); background: rgba(245,158,11,.10); }
  nav.side button .n { font-size: 11px; color: var(--muted); opacity: .7; margin-left: auto; font-family: var(--mono); }

  main { flex: 1; min-width: 0; }
  .head { margin-bottom: 18px; }
  .head h2 { font-size: 20px; margin: 0 0 6px; }
  .head p { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.5; max-width: 720px; }

  .progress { height: 6px; background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; margin: 0 0 20px; overflow: hidden; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .25s; }

  .step { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 18px 20px; margin-bottom: 14px; }
  .step.done { border-color: rgba(34,197,94,.35); }
  .step .row { display: flex; gap: 12px; align-items: flex-start; }
  .step input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .step .body { flex: 1; min-width: 0; }
  .step .t { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .step .tag { display: inline-block; font-size: 10.5px; font-weight: 600; border-radius: 99px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
  .tag.launcher { color: var(--accent); border: 1px solid rgba(245,158,11,.45); }
  .tag.agente { color: #7dd3fc; border: 1px solid rgba(56,189,248,.45); }
  .tag.utente { color: #86efac; border: 1px solid rgba(34,197,94,.45); }
  .step .d { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .step .d code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); font-size: 12px; }
  .note { margin-top: 10px; font-size: 12.5px; color: var(--warn); line-height: 1.5; }
  .note::before { content: "⚠ "; }

  .navb { display: flex; gap: 10px; margin-top: 6px; }
  .navb button {
    flex: 1; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  }
  .navb button:disabled { opacity: .4; cursor: not-allowed; }
  .navb button.primary { background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #1a1204; border: none; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; padding: 14px; }
    nav.side { width: 100%; flex-direction: row; flex-wrap: wrap; position: static; }
    nav.side button { flex: 1 1 45%; }
    .top .sub { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="logo">🟧</div>
  <h1>LIMET — Guida operativa</h1>
  <div class="sub">Ogni passo dice <b>cosa</b> fare e <b>dove</b> (Launcher / Agente / Utente)</div>
  <a class="lang" href="../../en/guides/workflow.html">EN</a>
</div>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main>
    <div class="head">
      <h2 id="scenTitle"></h2>
      <p id="scenDesc"></p>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="steps"></div>
    <div class="navb">
      <button id="prev">← Precedente</button>
      <button id="next" class="primary">Avanti →</button>
    </div>
  </main>
</div>

<script>
const SCENARIOS = [
  { id: "new", title: "1 · Nuovo progetto con LIMET",
    desc: "Attivare LIMET in un progetto nuovo, tutto dal launcher web.",
    steps: [
      { t: "Verifica i prerequisiti", tag: "Utente", d: "Componenti installati: Qdrant, Ollama, CEREBRO, Graphify (vedi install guide)." },
      { t: "Avvia il launcher web", tag: "Launcher", d: "Apri il terminale ed esegui <code>python <LIMET_HOME>\\scripts\\limet-launcher.py</code> → si apre il browser su <code>http://127.0.0.1:8799</code>." },
      { t: "Compila il form", tag: "Launcher", d: "Azione <b>Crea</b> · <b>Percorso</b> = cartella del progetto · <b>Lingua</b> = it/en · <b>Modalità</b> = Progetto · spunta <b>Strumenti di contesto</b>." },
      { t: "Crea", tag: "Launcher", d: "Clicca <b>Crea progetto</b>. Attendi il log fino a <b>Fatto. Il progetto è pronto.</b>" },
      { t: "Apri con l'agente", tag: "Agente", d: "Apri la cartella con Claude Code (<code>claude</code>) o Copilot (<code>gh copilot</code>): legge <code>AGENTS.md</code> e sa interrogare CEREBRO/Graphify.", n: "Controlla che AGENTS.md contenga i blocchi LIMET e LIMET-CONTEXT." }
    ] },
  { id: "feature", title: "2 · Nuova feature",
    desc: "La feature si sviluppa lavorando con l'agente nel progetto (template in limet/changes/); il launcher interviene solo alla fine per il re-index.",
    steps: [
      { t: "Apri il progetto con l'agente", tag: "Utente", d: "Apri la cartella con Claude Code (<code>claude</code>) o Copilot (<code>gh copilot</code>): l'agente legge <code>AGENTS.md</code> (blocco LIMET + LIMET-CONTEXT) e sa come applicare LIMET." },
      { t: "Assegna la feature", tag: "Utente", d: "Descrivi all'agente cosa vuoi costruire." },
      { t: "Esplorazione (contesto)", tag: "Agente", d: "L'agente interroga il <b>knowledge graph</b> (codice) e <b>CEREBRO</b> (documenti) per raccogliere contesto, senza che tu faccia nulla." },
      { t: "Proposta", tag: "Agente", d: "L'agente crea <code>limet/changes/0002-slug/PLAN.md</code> (o <code>CHANGE_PROPOSAL.md</code> + <code>SPEC.md</code> + <code>DESIGN.md</code> per modifiche ampie)." },
      { t: "Review", tag: "Utente", d: "Leggi e approva il piano. Ogni ambiguità deve essere una domanda con risposta, mai assunta." },
      { t: "Scomposizione in task", tag: "Agente", d: "L'agente crea <code>TASK_LIST.md</code> con strategia di test per ogni task." },
      { t: "Implementazione", tag: "Agente", d: "L'agente implementa nel perimetro dichiarato. Nessun effetto persistente (commit/push/deploy) senza tua autorizzazione." },
      { t: "Verifica (obbligatoria)", tag: "Agente", d: "L'agente compila <code>TEST_PLAN.md</code> + <code>TEST_EXECUTION.md</code> + <code>E2E_VERIFICATION.md</code>." },
      { t: "Sintesi non tecnica", tag: "Agente", d: "<code>NON_TECHNICAL_SUMMARY.md</code> (se serve)." },
      { t: "Archivio", tag: "Agente", d: "L'agente compila <code>ARCHIVE_ENTRY.md</code> e sposta la cartella da <code>limet/changes/</code> a <code>limet/archive/</code>." },
      { t: "Re-index", tag: "Launcher", d: "Azione <b>Re-index</b> → i documenti archiviati diventano ricercabili nel contesto RAG." }
    ] },
  { id: "bug", title: "3 · Bug fix",
    desc: "Il difetto si corregge lavorando con l'agente nel progetto (documenti in limet/changes/); il launcher interviene solo alla fine per il re-index.",
    steps: [
      { t: "Apri il progetto con l'agente", tag: "Utente", d: "Apri la cartella con Claude Code (<code>claude</code>) o Copilot (<code>gh copilot</code>): l'agente legge <code>AGENTS.md</code> (blocco LIMET + LIMET-CONTEXT) e sa già come lavorare e interrogare CEREBRO/Graphify." },
      { t: "Assegna il bug", tag: "Utente", d: "Descrivi il difetto all'agente: cosa succede e cosa ti aspetti." },
      { t: "Segnala il difetto", tag: "Agente", d: "L'agente crea <code>limet/changes/NNNN-slug/BUG_REPORT.md</code> (osservato / atteso / riproduzione)." },
      { t: "Isola la causa", tag: "Agente", d: "L'agente interroga il <b>knowledge graph</b> (Graphify) per localizzare il difetto e le sue dipendenze." },
      { t: "Proposta fix", tag: "Agente", d: "L'agente crea <code>PLAN.md</code> + <code>TASK_LIST.md</code> con test di regressione mirati." },
      { t: "Correggi e testa", tag: "Agente", d: "L'agente applica il fix e i test di regressione (il bug non deve tornare)." },
      { t: "Archivia", tag: "Agente", d: "<code>ARCHIVE_ENTRY.md</code> + sposta la cartella in <code>limet/archive/</code>." },
      { t: "Re-index", tag: "Launcher", d: "Apri il launcher → azione <b>Re-index</b> → i documenti archiviati diventano ricercabili nel contesto RAG per le prossime sessioni." }
    ] },
  { id: "workspace", title: "4 · Workspace multi-progetto",
    desc: "Più progetti correlati coordinati da un livello condiviso limet-workspace/.",
    steps: [
      { t: "Crea il livello workspace", tag: "Launcher", d: "Azione <b>Crea</b> + Modalità <b>Workspace</b>, con <b>Percorso</b> = cartella padre (es. C:\\Progetti\\myws)." },
      { t: "Compila MODULE_MAP", tag: "Utente", d: "Compila <code>limet-workspace/MODULE_MAP.md</code>: elenco progetti/moduli, ruoli, dipendenze e contratti." },
      { t: "Inizializza i figli", tag: "Launcher", d: "Azione <b>Crea</b> (Modalità Progetto) su ogni progetto figlio: auto-rileva il workspace come extra-collection." },
      { t: "Apri il workspace con l'agente", tag: "Utente", d: "Per coordinare una modifica che tocca più progetti, apri la cartella workspace con l'agente: legge <code>AGENTS.md</code> e <code>MODULE_MAP.md</code>." },
      { t: "Modifica cross-progetto", tag: "Agente", d: "L'agente crea <code>limet-workspace/changes/NNNN-slug/CROSS_PROJECT_CHANGE.md</code> con ordine produttore→consumatori." },
      { t: "Chiusura + re-index", tag: "Launcher", d: "Quando tutti i progetti sono 'done' + e2e ok: <b>Re-index</b> sia sul workspace sia sui progetti." }
    ] },
  { id: "maint", title: "5 · Manutenzione / re-index",
    desc: "Tenere aggiornati indice RAG (CEREBRO) e knowledge graph (Graphify).",
    steps: [
      { t: "Re-index", tag: "Launcher", d: "Dopo modifiche ai documenti o al codice: azione <b>Re-index</b> (aggiorna CEREBRO e Graphify, senza duplicati)." },
      { t: "Status", tag: "Launcher", d: "Azione <b>Status</b>: mostra progetti registrati e conteggio chunk." },
      { t: "Rimuovi", tag: "Launcher", d: "Azione <b>Rimuovi</b>: toglie il progetto dal registry (la collection Qdrant resta, cancellabile a parte)." }
    ] },
  { id: "glossary", title: "6 · Aggiornare il glossario",
    desc: "Terminologia condivisa: si aggiorna lavorando con l'agente, poi si re-indicizza dal launcher.",
    steps: [
      { t: "Apri il progetto con l'agente", tag: "Utente", d: "Apri la cartella con Claude Code o Copilot: l'agente legge <code>AGENTS.md</code> e sa dove stanno i documenti." },
      { t: "Assegna l'aggiornamento", tag: "Utente", d: "Chiedi all'agente di fissare un termine ambiguo nel glossario." },
      { t: "Rileva l'ambiguità", tag: "Agente", d: "Un termine/concetto/acronimo usato in modi confusi (§7 del manuale)." },
      { t: "Aggiorna il glossario", tag: "Agente", d: "L'agente compila <code>docs/glossary.md</code> (termini, concetti tecnici, acronimi)." },
      { t: "Re-index", tag: "Launcher", d: "Apri il launcher → azione <b>Re-index</b> → il glossario entra nel contesto RAG." }
    ] },
  { id: "cross-feature", title: "7 · Feature cross-progetto",
    desc: "Feature che attraversa più progetti: si coordina con l'agente nel workspace, poi si re-indicizza.",
    steps: [
      { t: "Apri il workspace con l'agente", tag: "Utente", d: "Apri la cartella workspace con l'agente: legge <code>AGENTS.md</code> e <code>MODULE_MAP.md</code> per coordinare i progetti coinvolti." },
      { t: "Documento ombrello", tag: "Agente", d: "L'agente crea <code>limet-workspace/changes/NNNN-slug/CROSS_PROJECT_CHANGE.md</code>." },
      { t: "Definisci il contratto", tag: "Agente", d: "Forma del contratto condiviso (API/schema/evento) scritta prima nel doc workspace." },
      { t: "Ciclo per-progetto", tag: "Agente", d: "Ogni progetto fa il proprio ciclo nei propri <code>limet/changes/</code> (link, non duplica)." },
      { t: "Sintesi", tag: "Agente", d: "<code>NON_TECHNICAL_SUMMARY.md</code> a livello workspace." },
      { t: "Chiusura + re-index", tag: "Launcher", d: "Tutti 'done' + e2e ok → <b>Re-index</b> a entrambi i livelli." }
    ] },
  { id: "monorepo", title: "8 · Monorepo multi-modulo",
    desc: "Variante del workspace: moduli di uno stesso repository (Appendice C.4).",
    steps: [
      { t: "Workspace sulla root", tag: "Launcher", d: "Azione <b>Crea</b> + Modalità <b>Workspace</b> sulla root del monorepo." },
      { t: "Mappa i moduli", tag: "Utente", d: "Compila <code>MODULE_MAP.md</code>: i moduli sono della stessa repo ('own repository?' = no)." },
      { t: "Inizializza i moduli", tag: "Launcher", d: "Azione <b>Crea</b> su ogni modulo (sotto-cartella)." },
      { t: "Apri il monorepo con l'agente", tag: "Utente", d: "Per il cambio contratto, apri la root (o il modulo) con l'agente: legge <code>MODULE_MAP.md</code> e rispetta l'ordine produttore→consumatori." },
      { t: "Cambio contratto", tag: "Agente", d: "Singolo commit/PR ammesso, ma ordine logico produttore → consumatori.", n: "Il vincolo di verifica e2e tra moduli resta obbligatorio." }
    ] },
  { id: "manual", title: "9 · Quando serve il manuale",
    desc: "La guida copre l'uso operativo. Questa mappa dice dove guardare nel manuale per il 'perché' e i casi limite.",
    steps: [
      { t: "Principi e tracciabilità", d: "→ <code>FRAMEWORK_MANUAL.md</code> <b>§1 / §1.2</b> — ogni ambiguità = domanda contestuale (risposta + data)." },
      { t: "Categorie di contesto", d: "→ <b>§2</b> — documentale (2.1), strutturale (2.2), dati reali (2.3), combinazione (2.4)." },
      { t: "Ciclo di vita completo", d: "→ <b>§3</b> — fasi fluide: puoi tornare indietro." },
      { t: "Convenzioni di lavoro", d: "→ <b>§4</b>." },
      { t: "Anti-pattern da evitare", d: "→ <b>§5</b>." },
      { t: "Verifica vincolante (test obbligatori)", d: "→ <b>§1.5 / §5</b> — nessun task 'done' senza strategia di verifica." },
      { t: "Adattabilità senza tool", d: "→ <b>§7</b> — degrado controllato senza CEREBRO/Graphify." },
      { t: "Indice dei template", d: "→ <b>§8</b>." },
      { t: "Attivazione pratica (AGENTS.md + CLAUDE.md)", d: "→ <b>§9</b> — meccanismo single-source." },
      { t: "Setup CEREBRO/Graphify (riferimento)", d: "→ <b>Appendice A</b>." },
      { t: "Esempi operativi passo-passo", d: "→ <b>Appendice B</b>." },
      { t: "Multi-progetto / workspace", d: "→ <b>Appendice C</b>." }
    ] }
];

const state = { idx: 0 };
function storageKey() { return "limet-guide:" + SCENARIOS[state.idx].id; }

function renderSide() {
  const side = document.getElementById("side");
  side.innerHTML = "";
  SCENARIOS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = i === state.idx ? "on" : "";
    b.innerHTML = `<span>${s.title}</span><span class="n">${doneCount(s)}/${s.steps.length}</span>`;
    b.onclick = () => { state.idx = i; render(); };
    side.appendChild(b);
  });
}
function doneCount(s) {
  const v = JSON.parse(localStorage.getItem("limet-guide:" + s.id) || "[]");
  return s.steps.filter((_, i) => v[i]).length;
}

function render() {
  const s = SCENARIOS[state.idx];
  document.getElementById("scenTitle").textContent = s.title;
  document.getElementById("scenDesc").textContent = s.desc;
  const saved = JSON.parse(localStorage.getItem(storageKey()) || "[]");
  const stepsEl = document.getElementById("steps");
  stepsEl.innerHTML = "";
  s.steps.forEach((st, i) => {
    const el = document.createElement("div");
    el.className = "step" + (saved[i] ? " done" : "");
    const note = st.n ? `<div class="note">${st.n}</div>` : "";
    const tag = st.tag ? `<span class="tag ${st.tag.toLowerCase()}">${st.tag}</span>` : "";
    el.innerHTML = `<div class="row"><input type="checkbox" ${saved[i] ? "checked" : ""}><div class="body"><div class="t">${i + 1}. ${st.t}${tag}</div><div class="d">${st.d}</div>${note}</div></div>`;
    el.querySelector("input").onchange = (e) => {
      const cur = JSON.parse(localStorage.getItem(storageKey()) || "[]");
      cur[i] = e.target.checked;
      localStorage.setItem(storageKey(), JSON.stringify(cur));
      el.classList.toggle("done", e.target.checked);
      updateBar(); renderSide();
    };
    stepsEl.appendChild(el);
  });
  document.getElementById("prev").disabled = state.idx === 0;
  document.getElementById("next").disabled = state.idx === SCENARIOS.length - 1;
  updateBar();
  renderSide();
}
function updateBar() {
  const s = SCENARIOS[state.idx];
  const v = JSON.parse(localStorage.getItem(storageKey()) || "[]");
  const done = s.steps.filter((_, i) => v[i]).length;
  document.getElementById("bar").style.width = (done / s.steps.length * 100) + "%";
}

document.getElementById("prev").onclick = () => { state.idx = Math.max(0, state.idx - 1); render(); };
document.getElementById("next").onclick = () => { state.idx = Math.min(SCENARIOS.length - 1, state.idx + 1); render(); };
render();
</script>
</body>
</html>
