<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMET — Guida operativa</title>
<style>
  :root {
    --bg: #0e1116; --bg2: #141923; --card: #171d29; --border: #262f40;
    --text: #e6ebf2; --muted: #8b96a8; --accent: #f59e0b; --accent2: #d97706;
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .top {
    display: flex; align-items: center; gap: 12px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); background: rgba(14,17,22,.7);
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px);
  }
  .top .logo { font-size: 22px; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .top .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .top .lang { margin-left: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  .top .lang:hover { color: var(--text); border-color: var(--accent); }

  .layout { display: flex; gap: 20px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
  nav.side { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 70px; }
  nav.side button {
    text-align: left; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13.5px; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  nav.side button:hover { border-color: #3a4a63; color: var(--text); }
  nav.side button.on { border-color: var(--accent); color: var(--text); background: rgba(245,158,11,.10); }
  nav.side button .n { font-size: 11px; color: var(--muted); opacity: .7; margin-left: auto; font-family: var(--mono); }

  main { flex: 1; min-width: 0; }
  .head { margin-bottom: 18px; }
  .head h2 { font-size: 20px; margin: 0 0 6px; }
  .head p { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.5; max-width: 720px; }

  .progress { height: 6px; background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; margin: 0 0 20px; overflow: hidden; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .25s; }

  .step { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 18px 20px; margin-bottom: 14px; }
  .step.done { border-color: rgba(34,197,94,.35); }
  .step .row { display: flex; gap: 12px; align-items: flex-start; }
  .step input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .step .body { flex: 1; min-width: 0; }
  .step .t { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .step .tag { display: inline-block; font-size: 10.5px; font-weight: 600; border-radius: 99px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
  .tag.launcher { color: var(--accent); border: 1px solid rgba(245,158,11,.45); }
  .tag.agente { color: #7dd3fc; border: 1px solid rgba(56,189,248,.45); }
  .tag.utente { color: #86efac; border: 1px solid rgba(34,197,94,.45); }
  .step .d { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .step .d code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); font-size: 12px; }
  .note { margin-top: 10px; font-size: 12.5px; color: var(--warn); line-height: 1.5; }
  .note::before { content: "⚠ "; }
  .code { margin-top: 10px; background: #0b0e13; border: 1px solid var(--border); border-radius: 9px; font-family: var(--mono); font-size: 12.5px; padding: 12px 14px; position: relative; overflow-x: auto; white-space: pre; color: #c7d2e0; }
  .code button.copy { position: absolute; top: 8px; right: 8px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 4px 9px; font-size: 11px; cursor: pointer; }
  .code button.copy:hover { color: var(--text); border-color: var(--accent); }

  .navb { display: flex; gap: 10px; margin-top: 6px; }
  .navb button {
    flex: 1; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  }
  .navb button:disabled { opacity: .4; cursor: not-allowed; }
  .navb button.primary { background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #1a1204; border: none; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; padding: 14px; }
    nav.side { width: 100%; flex-direction: row; flex-wrap: wrap; position: static; }
    nav.side button { flex: 1 1 45%; }
    .top .sub { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="logo">🟧</div>
  <h1>LIMET — Guida operativa</h1>
  <div class="sub">Ogni passo dice <b>cosa</b> fare e <b>dove</b> (Launcher / Agente / Utente)</div>
  <a class="lang" href="../../en/guides/workflow.html">EN</a>
</div>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main>
    <div class="head">
      <h2 id="scenTitle"></h2>
      <p id="scenDesc"></p>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="steps"></div>
    <div class="navb">
      <button id="prev">← Precedente</button>
      <button id="next" class="primary">Avanti →</button>
    </div>
  </main>
</div>

<script>
const SCENARIOS = [
  { id: "new", title: "1 · Nuovo progetto con LIMET",
    desc: "Installare LIMET in una cartella esistente o nuova. Il launcher prepara framework e indici; l'agente scrive i documenti di analisi.",
    steps: [
      { t: "Verifica i prerequisiti", tag: "Utente", d: "Per gli indici: Qdrant e Ollama raggiungibili, modello di embedding configurato in CEREBRO, CEREBRO installato con <code>scripts</code> e <code>.venv</code>. Graphify deve essere nel PATH per il grafo del codice; se manca, lo script segnala un avviso e prosegue con i documenti. La presenza del comando Graphify non garantisce che la generazione riesca." },
      { t: "Avvia il launcher web", tag: "Utente", d: "Apri il terminale ed esegui il comando qui sotto, adattando la cartella d'installazione. Il browser si apre su <code>http://127.0.0.1:8799</code> (porta predefinita).", c: 'python "C:\\Progetti\\VSC\\LIMET\\scripts\\limet-launcher.py"' },
      { t: "Compila il form", tag: "Launcher", d: "Azione <b>Crea</b> · <b>Percorso</b> = cartella del progetto · <b>Lingua</b> = it/en · <b>Modalità</b> = Progetto · spunta <b>Strumenti di contesto</b>." },
      { t: "Imposta CEREBRO_HOME e controlla il percorso", tag: "Launcher", d: "<b>CEREBRO_HOME</b> indica l'installazione centrale, per esempio <code>C:\\software\\cerebro</code>, non la cartella del progetto. Il launcher usa il nome dell'ultima cartella per ricavare il nome normalizzato e la collection: <code>CSI-COSMO</code> → <code>csi_cosmo</code> → <code>CRB_csi_cosmo</code>. Se il registro o la collection esistono già, seleziona automaticamente <b>Re-index</b> e disabilita <b>Crea</b>.", n: "Cartelle diverse con lo stesso nome producono lo stesso identificativo: controlla la collection prima di procedere." },
      { t: "Crea e controlla entrambe le fasi", tag: "Launcher", d: "Clicca <b>Crea progetto</b>. Prima <b>LIMET init</b> installa <code>limet\\</code>, aggiorna il blocco in <code>AGENTS.md</code> e assicura l'import <code>@AGENTS.md</code> in <code>CLAUDE.md</code>. Con <b>Strumenti di contesto</b> attivo, segue <b>LIMET context (CEREBRO RAG + Graphify)</b>: prepara <code>docs\\_templates\\</code>, genera il grafo e copia il report in <code>docs\\architecture\\GRAPH_REPORT.md</code> se disponibile, registra <code>docs\\</code>, <code>limet\\changes\\</code>, <code>limet\\archive\\</code>, indicizza e aggiorna le istruzioni. Attendi <b>Fatto. Il progetto è pronto.</b>", n: "Senza Strumenti di contesto installi solo il framework: non registri il progetto in CEREBRO e non crei gli indici. Un errore nella seconda fase non annulla i file già creati nella prima." },
      { t: "Controlla esclusioni locali Git", tag: "Utente", d: "Se la cartella appartiene a un repository Git, <code>limet.ps1 init/update</code> aggiunge un blocco locale in <code>.git\\info\\exclude</code> per <code>AGENTS.md</code>, <code>CLAUDE.md</code> e <code>limet\\</code> (oppure <code>limet-workspace\\</code>). Non modifica <code>.gitignore</code>. Se la cartella non è Git, salta questo passaggio.", n: "Le esclusioni non rendono ignorati file già tracciati e non includono automaticamente docs, graphify-out o copilot-instructions.md. Il Re-index del launcher esegue limet-index update, non limet.ps1 update: non aggiorna questo blocco." },
      { t: "Apri con l'agente", tag: "Utente", d: "Apri un terminale nella cartella e avvia Claude Code (<code>claude</code>) o Copilot CLI (<code>copilot</code>). Copilot legge <code>AGENTS.md</code>; Claude usa <code>CLAUDE.md</code> con l'import. La fase di contesto aggiorna anche <code>.github\\copilot-instructions.md</code>. Il blocco PROJECT elenca tutti i Markdown locali sotto docs, ordinati per percorso e senza limite di otto file; esclude le cartelle _templates. Non include automaticamente fonti esterne, PDF o moduli senza documentazione Markdown in docs.", n: "Controlla che AGENTS.md contenga LIMET e LIMET-CONTEXT. L'inventario PROJECT non prova l'indicizzazione: le fonti sono censite in projects.json. L'indicizzazione non scrive da sola una specifica, un piano o l'intera analisi della codebase." },
      { t: "Genera i documenti approfonditi", tag: "Agente", d: "Copia questo prompt all'agente per analizzare la codebase e creare (o aggiornare) la doc suite, seguendo il playbook <code>limet/templates/CODEBASE_ANALYSIS_TEMPLATE.md</code>:", c: "Segui limet/templates/CODEBASE_ANALYSIS_TEMPLATE.md e analizza la codebase (parti da Graphify + codice), istanzia i template in docs/_templates/ (MODULE_MAP_TEMPLATE.md, ARCHITECTURE_TEMPLATE.md, CONVENTIONS_TEMPLATE.md, GLOSSARY_TEMPLATE.md) e produci/aggiorna in docs/:\n\n- module-map.md\n- architecture.md   (C4, con diagrammi Mermaid)\n- decisions.md      (ADR)\n- dependencies.md\n- conventions.md\n- glossary.md\n- NON_TECHNICAL_SUMMARY.md\n\nUsa citazioni file:line, segnala le incertezze. Se un documento esiste già, AGGIORNALO (non riscriverlo). Non avviare indicizzazione automaticamente: la eseguirò dal launcher." },
      { t: "Indicizza i documenti appena scritti", tag: "Launcher", d: "Torna al percorso del progetto e usa <b>Re-index → Incrementale</b>. Questo passo rende ricercabile l'analisi scritta dopo la creazione; non serve ricopiare documenti già dentro docs, changes o archive censiti." }
    ] },
  { id: "documents", title: "Documentazione · Aggiunta e indice",
    desc: "Un solo bottone sostituisce Aggiungi documenti e Genera documentazione: copia, censisce i percorsi e aggiorna gli indici. Non scrive i documenti di analisi al posto dell'agente.",
    steps: [
      { t: "Seleziona il progetto già registrato", tag: "Launcher", d: "Imposta <b>Percorso progetto</b> e <b>CEREBRO_HOME</b>. Dopo il rilevamento di un progetto registrato o di una collection, puoi aprire <b>Documentazione</b>; la scheda è disponibile anche dopo Crea. Se non sei registrato, completa prima <b>Crea</b> con Strumenti di contesto." },
      { t: "Verifica prerequisiti", tag: "Launcher", d: "Clicca <b>Verifica prerequisiti</b>: il bottone di aggiunta si abilita solo se il progetto è registrato in CEREBRO e Qdrant e Ollama rispondono. Il controllo mostra slug, collection, cartella di destinazione e documenti presenti (al massimo 20 nomi). Una collection ancora assente <b>non</b> blocca l'aggiunta.", n: "Il conteggio riguarda la cartella di destinazione, non tutti i percorsi del registro né il numero di chunk in Qdrant. Questo controllo non verifica il modello di embedding o il successo di Graphify." },
      { t: "Inserisci file o cartelle, uno per riga", tag: "Launcher", d: "Nel campo <b>Documenti di progetto</b> inserisci percorsi locali esistenti, senza virgolette. Puoi mescolare file e cartelle. Scegli <b>Sotto-cartella</b>: nessuna, <b>features</b> o <b>bugfixes</b>. La categoria cambia la destinazione delle copie, non i percorsi originali registrati.", c: "C:\\Documenti\\COSMO\\requisiti.pdf\nC:\\Documenti\\COSMO\\analisi-feature" },
      { t: "Controlla la destinazione delle copie", tag: "Utente", d: "La destinazione è la <b>prima cartella esistente</b> nell'elenco <code>docs</code> del progetto in <code>CEREBRO_HOME\\projects.json</code>. Se non ne trova, usa <code>&lt;progetto&gt;\\docs</code>. La sotto-cartella scelta viene aggiunta a questa base: <b>non è sempre docs\\features</b>.", n: "Una cartella sorgente viene copiata ricorsivamente mantenendo i percorsi interni, senza aggiungere il suo nome come livello. File con la stessa destinazione possono essere sovrascritti: usa nomi distinti, non indicare la destinazione come sorgente né una cartella che la contiene. Il launcher non sposta o elimina gli originali." },
      { t: "Clicca Aggiungi documenti e aggiorna indice", tag: "Launcher", d: "Ordine effettivo: <b>1.</b> copia i file; <b>2.</b> invoca CEREBRO per aggiungere i percorsi originali validi a <code>projects.json</code>; <b>3.</b> avvia inizializzazione o aggiornamento secondo l'esistenza della collection. I vecchi percorsi restano, i nuovi si aggiungono; lo stesso percorso già censito non viene aggiunto una seconda volta.", n: "Percorsi inesistenti sono attualmente saltati. Leggi Copiati N file e Censimento percorsi nel log. Se manca il Python della .venv di CEREBRO o register_project.py, il censimento mostra un AVVISO: non considerare i percorsi registrati solo perché la copia è riuscita." },
      { t: "Comprendi la scelta automatica dell'indice", tag: "Utente", d: "Se <code>CRB_&lt;slug&gt;</code> esiste, esegue <b>limet-index update</b>: indicizzazione incrementale, Graphify e sincronizzazione dei blocchi in AGENTS.md, CLAUDE.md e copilot-instructions.md. Se manca, esegue <b>LIMET init + LIMET context</b>. Graphify opera anche sulla root workspace: crea il grafo con <code>graphify extract . --code-only --no-cluster</code> se assente, altrimenti lo aggiorna; poi genera il report con <code>cluster-only . --no-label</code>. La scansione del codice è locale, senza estrazione semantica LLM. Non serve un secondo bottone Genera documentazione.", n: "Il bottone unico non espone Forza tutto o Pulizia. Se Qdrant è assente o vuoto, CEREBRO ignora la cache locale e ricostruisce i documenti censiti. L'operazione parte dal tuo clic, non dall'agente." },
      { t: "Conferma il risultato, non solo la copia", tag: "Utente", d: "Attendi <b>Fatto. Documenti aggiunti e indicizzati.</b>, poi controlla eventuali <b>[AVVISO]</b>, <b>WARNING</b> o <b>[ERRORE]</b>. Verifica che <code>projects.json</code> contenga vecchi e nuovi percorsi. L'ingestione riguarda i formati supportati da CEREBRO, non ogni file copiato. Origine e copia possono entrambe essere fonti: non interpretare l'upsert senza duplicati come deduplicazione per contenuto tra percorsi diversi." },
      { t: "Fai scrivere o aggiornare l'analisi all'agente", tag: "Agente", d: "Dopo l'indicizzazione, chiedi all'agente di usare documenti e codice per produrre specifiche, piani o documentazione approfondita. Il bottone aggiorna il contesto e le istruzioni: <b>non genera automaticamente questi testi</b>. Quando l'agente modifica documenti già censiti, usa Re-index; per nuove fonti esterne usa di nuovo il bottone unico." }
    ] },
  { id: "feature", title: "2 · Nuova feature",
    desc: "Carica prima i requisiti col bottone unico, poi lavora con l'agente; a fine modifica aggiorna gli indici.",
    steps: [
      { t: "Carica prima i requisiti", tag: "Launcher", d: "Se hai documenti esterni, usa <b>Documentazione → Verifica prerequisiti → Aggiungi documenti e aggiorna indice</b>, categoria <b>features</b>. Segui lo scenario Documentazione per verificare destinazione, censimento e risultato." },
      { t: "Apri il progetto con l'agente", tag: "Utente", d: "Apri la cartella con Claude Code (<code>claude</code>) o Copilot CLI (<code>copilot</code>): l'agente legge <code>AGENTS.md</code> (blocco LIMET + LIMET-CONTEXT) e sa come applicare LIMET." },
      { t: "Assegna la feature", tag: "Utente", d: "Dai all'agente la descrizione (e i documenti caricati) con questo prompt — istanzia i template e genera piano, specifica e task in un colpo:", c: "Analizza la descrizione e i documenti in docs/, poi genera in limet/changes/NNNN-slug/ istanziando i template in limet/templates/:\n\n- PLAN.md  (da PLAN_TEMPLATE.md) — il perché\n  oppure, per modifiche ampie: CHANGE_PROPOSAL.md + SPEC.md + DESIGN.md\n  (da CHANGE_PROPOSAL_TEMPLATE.md + SPEC_TEMPLATE.md + DESIGN_TEMPLATE.md)\n- TASK_LIST.md  (da TASK_LIST_TEMPLATE.md) — con strategia di test per ogni task; TASK.md (da TASK_TEMPLATE.md) per un task complesso\n\nDopo aver creato la cartella della modifica, registra in C:\\software\\cerebro\\projects.json, nella lista docs del progetto/workspace corretto, i percorsi assoluti di limet\\changes e limet\\archive di ogni modulo coinvolto. Aggiungi solo i percorsi mancanti: se un percorso è già presente, lascialo invariato (operazione idempotente, non è un errore, non sovrascrivere/sostituire la lista). Non eseguire indicizzazione: ricordami di avviare Re-index incrementale dal Launcher.\n\nPoi fermati e chiedimi l'approvazione prima di implementare." },
      { t: "Esplorazione (contesto)", tag: "Agente", d: "L'agente interroga il <b>knowledge graph</b> (codice) e <b>CEREBRO</b> (documenti), e legge i documenti caricati in <code>docs/</code> (coi nomi che hai specificato) + la tua descrizione." },
      { t: "Proposta", tag: "Agente", d: "Basandosi sulla tua descrizione e sul documento caricato, l'agente crea <code>limet/changes/0002-slug/PLAN.md</code> (o <code>CHANGE_PROPOSAL.md</code> per modifiche ampie)." },
      { t: "Specifica della feature", tag: "Agente", d: "L'agente crea <code>SPEC.md</code>: il documento che <b>descrive la nuova feature</b> (cosa fa, requisiti verificabili). Verrà archiviato in <code>limet/archive/</code> e indicizzato in CEREBRO." },
      { t: "Review", tag: "Utente", d: "Leggi e approva il piano. Ogni ambiguità deve essere una domanda con risposta, mai assunta." },
      { t: "Scomposizione in task", tag: "Agente", d: "L'agente crea <code>TASK_LIST.md</code> con strategia di test per ogni task." },
      { t: "Implementazione", tag: "Agente", d: "L'agente implementa nel perimetro dichiarato. Nessun effetto persistente (commit/push/deploy) senza tua autorizzazione." },
      { t: "Verifica (obbligatoria)", tag: "Agente", d: "L'agente compila <code>TEST_PLAN.md</code> (da <code>TEST_PLAN_TEMPLATE.md</code>) + <code>TEST_EXECUTION.md</code> (da <code>TEST_EXECUTION_TEMPLATE.md</code>) + <code>E2E_VERIFICATION.md</code> (da <code>E2E_VERIFICATION_TEMPLATE.md</code>)." },
      { t: "Sintesi non tecnica", tag: "Agente", d: "<code>NON_TECHNICAL_SUMMARY.md</code> (da <code>NON_TECHNICAL_SUMMARY_TEMPLATE.md</code>, se serve)." },
      { t: "Archivio", tag: "Agente", d: "L'agente compila <code>ARCHIVE_ENTRY.md</code> (da <code>ARCHIVE_ENTRY_TEMPLATE.md</code>) e sposta la cartella da <code>limet/changes/</code> a <code>limet/archive/</code>." },
      { t: "Aggiorna i documenti", tag: "Agente", d: "Dopo l'implementazione, aggiorna la doc suite (copia il prompt):", c: "Aggiorna i documenti approfonditi in docs/ e NON_TECHNICAL_SUMMARY.md per riflettere le modifiche appena fatte. Segui limet/templates/CODEBASE_ANALYSIS_TEMPLATE.md. Se un documento esiste già, AGGIORNALO (non riscriverlo). Non avviare indicizzazione automaticamente: la eseguirò dal launcher." },
      { t: "Re-index", tag: "Launcher", d: "Azione <b>Re-index</b> → i documenti archiviati diventano ricercabili nel contesto RAG." }
    ] },
  { id: "bug", title: "3 · Bug fix",
    desc: "Carica prima le evidenze col bottone unico, poi correggi con l'agente e aggiorna gli indici dopo la verifica.",
    steps: [
      { t: "Carica prima le evidenze", tag: "Launcher", d: "Per documenti e log del difetto usa <b>Documentazione → Verifica prerequisiti → Aggiungi documenti e aggiorna indice</b>, categoria <b>bugfixes</b>. File copiati non significa necessariamente file indicizzabili: immagini e altri allegati vanno forniti anche all'agente se necessario." },
      { t: "Apri il progetto con l'agente", tag: "Utente", d: "Apri la cartella con Claude Code (<code>claude</code>) o Copilot CLI (<code>copilot</code>): l'agente legge <code>AGENTS.md</code> (blocco LIMET + LIMET-CONTEXT) e sa già come lavorare e interrogare CEREBRO/Graphify." },
      { t: "Assegna il bug", tag: "Utente", d: "Dai all'agente la descrizione (e i documenti caricati) con questo prompt — istanzia i template:", c: "Analizza la descrizione e i documenti in docs/, poi genera in limet/changes/NNNN-slug/ istanziando i template in limet/templates/:\n\n- BUG_REPORT.md (da BUG_REPORT_TEMPLATE.md) — osservato / atteso / riproduzione\n- PLAN.md (da PLAN_TEMPLATE.md) — fix proposto\n- TASK_LIST.md (da TASK_LIST_TEMPLATE.md) — con test di regressione; TASK.md (da TASK_TEMPLATE.md) per un task complesso\n\nDopo aver creato la cartella della modifica, registra in C:\\software\\cerebro\\projects.json, nella lista docs del progetto/workspace corretto, i percorsi assoluti di limet\\changes e limet\\archive di ogni modulo coinvolto. Aggiungi solo i percorsi mancanti: se un percorso è già presente, lascialo invariato (operazione idempotente, non è un errore, non sovrascrivere/sostituire la lista). Non eseguire indicizzazione: ricordami di avviare Re-index incrementale dal Launcher.\n\nPoi fermati e chiedimi l'approvazione prima di implementare." },

const state = { idx: 0 };
function storageKey() { return "limet-guide:v2:" + SCENARIOS[state.idx].id; }

function renderSide() {
  const side = document.getElementById("side");
  side.innerHTML = "";
  SCENARIOS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = i === state.idx ? "on" : "";
    b.innerHTML = `<span>${s.title}</span><span class="n">${doneCount(s)}/${s.steps.length}</span>`;
    b.onclick = () => { state.idx = i; render(); };
    side.appendChild(b);
  });
}
function doneCount(s) {
  const v = JSON.parse(localStorage.getItem("limet-guide:v2:" + s.id) || "[]");
  return s.steps.filter((_, i) => v[i]).length;
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function copy(btn, text) {
  const ok = () => { btn.textContent = "copiato ✓"; setTimeout(() => btn.textContent = "copia", 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(ok); else ok();
}

function render() {
  const s = SCENARIOS[state.idx];
  document.getElementById("scenTitle").textContent = s.title;
  document.getElementById("scenDesc").textContent = s.desc;
  const saved = JSON.parse(localStorage.getItem(storageKey()) || "[]");
  const stepsEl = document.getElementById("steps");
  stepsEl.innerHTML = "";
  s.steps.forEach((st, i) => {
    const el = document.createElement("div");
    el.className = "step" + (saved[i] ? " done" : "");
    const note = st.n ? `<div class="note">${st.n}</div>` : "";
    const tag = st.tag ? `<span class="tag ${st.tag.toLowerCase()}">${st.tag}</span>` : "";
    const code = st.c ? `<div class="code"><button class="copy">copia</button>${esc(st.c)}</div>` : "";
    el.innerHTML = `<div class="row"><input type="checkbox" ${saved[i] ? "checked" : ""}><div class="body"><div class="t">${i + 1}. ${st.t}${tag}</div><div class="d">${st.d}</div>${code}${note}</div></div>`;
    el.querySelector("input").onchange = (e) => {
      const cur = JSON.parse(localStorage.getItem(storageKey()) || "[]");
      cur[i] = e.target.checked;
      localStorage.setItem(storageKey(), JSON.stringify(cur));
      el.classList.toggle("done", e.target.checked);
      updateBar(); renderSide();
    };
    const cp = el.querySelector("button.copy");
    if (cp) cp.onclick = () => copy(cp, st.c);
    stepsEl.appendChild(el);
  });
  document.getElementById("prev").disabled = state.idx === 0;
  document.getElementById("next").disabled = state.idx === SCENARIOS.length - 1;
  updateBar();
  renderSide();
}
function updateBar() {
  const s = SCENARIOS[state.idx];
  const v = JSON.parse(localStorage.getItem(storageKey()) || "[]");
  const done = s.steps.filter((_, i) => v[i]).length;
  document.getElementById("bar").style.width = (done / s.steps.length * 100) + "%";
}

document.getElementById("prev").onclick = () => { state.idx = Math.max(0, state.idx - 1); render(); };
document.getElementById("next").onclick = () => { state.idx = Math.min(SCENARIOS.length - 1, state.idx + 1); render(); };
render();
</script>
